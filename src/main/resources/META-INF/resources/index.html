<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Snack Database</title>
    <link rel="icon" type="image/x-icon" href="faviconV2.png">
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/wingcss/0.1.8/wing.min.css"/>
    <style>
        input[type=number] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            -webkit-transition: .5s;
            transition: .5s;
            outline: 0;
            font-family: 'Open Sans', serif;
        }
    </style>
    <!-- Load AngularJS -->
    <script src="//ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js"></script>
    <script type="text/javascript">
      var app = angular.module("SnackManagement", []);

      //Controller Part
      app.controller("SnackManagementController", function ($scope, $http) {

        //Initialize page with default data which is blank in this example
        $scope.snacks = [];

        $scope.form = {
          id: -1,
          name: ""
        };

        //Now load the data from server
        _refreshPageData();

        //HTTP POST/PUT methods for add/edit snacks
        $scope.update = function () {
          var method = "";
          var url = "";
          var data = {};
          if ($scope.form.id == -1) {
            //Id is absent so add snacks - POST operation
            method = "POST";
            url = 'entity/snacks';
            data.name = $scope.form.name;
          } else {
            //If Id is present, it's edit operation - PUT operation
            method = "PUT";
            url = 'entity/snacks/' + $scope.form.id;
            data.name = $scope.form.name;
          }

          $http({
            method: method,
            url: url,
            data: angular.toJson(data),
            headers: {
              'Content-Type': 'application/json'
            }
          }).then(_success, _error);
        };

        //HTTP DELETE- delete snack by id
        $scope.remove = function (snack) {
          $http({
            method: 'DELETE',
            url: 'entity/snacks/' + snack.id
          }).then(_success, _error);
        };

        //In case of edit snacks, populate form with snack data
        $scope.edit = function (snack) {
          $scope.form.name = snack.name;
          $scope.form.id = snack.id;
        };

          /* Private Methods */
        //HTTP GET- get all snacks collection
        function _refreshPageData() {
          $http({
            method: 'GET',
            url: 'entity/snacks'
          }).then(function successCallback(response) {
            $scope.snacks = response.data;
          }, function errorCallback(response) {
            console.log(response.statusText);
          });
        }

        function _success(response) {
          _refreshPageData();
          _clearForm()
        }

        function _error(response) {
          alert(response.data.message || response.statusText);
        }

        //Clear the form
        function _clearForm() {
          $scope.form.name = "";
          $scope.form.id = -1;
        }
      });
    </script>
</head>
<body ng-app="SnackManagement" ng-controller="SnackManagementController">
  <div class="bg-gradient-to-right">
    <h1 class="h1-center text-8xl font-semibold text-slate-50 py-12 font-mono">Developer Day 2026 </h1>
  </div>
  <div class="flex-container">
    <div class="flex-child  bg-gradient-to-right-child">
      <div class="container">
        <h2 class="font-mono text-slate-50">Request snacks</h2>
        <form ng-submit="update()">
          <div class="row">
              <div class="col-6"><input type="text" placeholder="Name" ng-model="form.name" size="60"/></div>
          </div>
          <input type="submit" value="Save"/>
      </form>
      <h3 class="font-mono text-slate-50 underline">Snacks List</h3>
        <div class="row" ng-repeat="snack in snacks">
          <div class="col-6 font-mono text-slate-50 text-4xl">{{ snack.name }}</div>
          <div class="col-4">
            <a ng-click="edit( snack )" class="btn">Edit</a> <a ng-click="remove( snack )" class="btn">Remove</a>
          </div>
      </div>
      </div>
    </div>
    <div class="flex-child motion-panel">
      <div class="picture" data-floating-stage aria-hidden="true">
        <img class="floating-picture" src="images/3dobj-DevDragon-PurpleLit-L.Small_square_transparent.png" alt="" aria-hidden="true" />
        <img class="floating-picture" src="images/3Dobj-Rubberduck-Purplelight-L.Small_square_transparent.png" alt="" aria-hidden="true" />
        <img class="floating-picture" src="images/3Dobj-DevRocket-PurpleLit-S.png.Small_square_transparent.png" alt="" aria-hidden="true" />
        <img class="floating-picture" src="images/3Dobj-Devcomputer-Purplelight-L.Small_square_transparent.png" alt="" aria-hidden="true" />
        <img class="floating-picture" src="images/3dobj-DevSailingShip-PurpleLit-R.Small_square_transparent.png" alt="" aria-hidden="true" />
        <img class="floating-picture floating-picture--portrait" src="images/Repo_Pose_07_YogaTree0000.Medium_square_transparent.png" alt="" aria-hidden="true" />
      </div>
    </div>
    
  </div>

  <script type="text/javascript">
    (function () {
      var stage = document.querySelector('[data-floating-stage]');
      var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!stage || prefersReducedMotion) {
        return;
      }

      stage.classList.add('is-animated');
      var pictures = Array.prototype.slice.call(stage.querySelectorAll('.floating-picture'));
      var lastFrame = performance.now();
      var states = pictures.map(function (picture) {
        var speed = 25 + Math.random() * 20;
        var angle = Math.random() * Math.PI * 2;

        return {
          picture: picture,
          x: Math.random() * Math.max(0, stage.clientWidth - picture.offsetWidth),
          y: Math.random() * Math.max(0, stage.clientHeight - picture.offsetHeight),
          velocityX: Math.cos(angle) * speed,
          velocityY: Math.sin(angle) * speed,
          rotation: Math.random() * 16 - 8,
          rotationSpeed: Math.random() * 5 - 2.5,
          nextTurn: lastFrame + 1200 + Math.random() * 2800
        };
      });

      function turnRandomly(state, now) {
        if (now < state.nextTurn) {
          return;
        }

        var turn = (Math.random() - 0.5) * 0.8;
        var cosine = Math.cos(turn);
        var sine = Math.sin(turn);
        var velocityX = state.velocityX;

        state.velocityX = velocityX * cosine - state.velocityY * sine;
        state.velocityY = velocityX * sine + state.velocityY * cosine;
        state.nextTurn = now + 1200 + Math.random() * 2800;
      }

      function animate(now) {
        var elapsedSeconds = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;

        states.forEach(function (state) {
          var maxX = Math.max(0, stage.clientWidth - state.picture.offsetWidth);
          var maxY = Math.max(0, stage.clientHeight - state.picture.offsetHeight);

          turnRandomly(state, now);
          state.x += state.velocityX * elapsedSeconds;
          state.y += state.velocityY * elapsedSeconds;
          state.rotation += state.rotationSpeed * elapsedSeconds;

          if (state.x <= 0 || state.x >= maxX) {
            state.x = Math.max(0, Math.min(state.x, maxX));
            state.velocityX *= -1;
          }

          if (state.y <= 0 || state.y >= maxY) {
            state.y = Math.max(0, Math.min(state.y, maxY));
            state.velocityY *= -1;
          }

          state.picture.style.transform = 'translate3d(' + state.x + 'px, ' + state.y + 'px, 0) rotate(' + state.rotation + 'deg)';
        });

        window.requestAnimationFrame(animate);
      }

      window.requestAnimationFrame(animate);
    }());
  </script>
</body>
</html>
